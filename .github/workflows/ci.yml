name: CI - CreewLoop Test & Quality Suite

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Compilation & Syntax Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python compilation (syntax check)
        run: |
          python -m compileall -q src/
          python -m compileall -q run.py
          python -m compileall -q test_decision_flow.py
          python -m compileall -q test_ui_interactive.py

      - name: Execute DecisionManager concurrency unit test
        run: |
          python test_decision_flow.py
